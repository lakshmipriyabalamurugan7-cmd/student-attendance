<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #243b55, #172d46);
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        /* Role Tabs */
        .role-tabs {
            display: flex;
            gap: 8px;
            padding: 5px;
            background: #0f172a;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .role-tab {
            flex: 1;
            padding: 11px 5px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .role-tab.active {
            background: #38bdf8;
            color: #102033;
            box-shadow: 0 4px 12px #38bdf840;
        }

        .role-tab:hover:not(.active) {
            background: #ffffff15;
            color: white;
        }

        h2 {
            text-align: center;
            font-size: 21px;
            margin-bottom: 20px;
            color: #7dd3fc;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #f1f5f9;
            color: #111827;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border: 2px solid #38bdf8;
            box-shadow: 0 0 8px #38bdf840;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #38bdf8;
            color: #102033;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #0ea5e9;
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        @media (max-width: 450px) {
            .login-box {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Attendance System</h1>
        <p class="subtitle">Student Management Portal</p>

        <!-- Admin / Faculty / Student Tabs -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" data-role="admin">
                Admin
            </button>

            <button type="button" class="role-tab" data-role="faculty">
                Faculty
            </button>

            <button type="button" class="role-tab" data-role="student">
                Student
            </button>
        </div>

        <h2 id="loginTitle">Admin Login</h2>


        <form id="loginForm">
            <input
                type="text"
                id="name"
                placeholder="Enter Name"
                autocomplete="name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const API_URL = "https://student-attendance-m60w.onrender.com";

        let selectedRole = "admin";

        const roleTabs = document.querySelectorAll(".role-tab");
        const loginTitle = document.getElementById("loginTitle");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");

        // Switch between Admin, Faculty and Student
        roleTabs.forEach(tab => {
            tab.addEventListener("click", function() {
                selectedRole = this.dataset.role;

                roleTabs.forEach(t => t.classList.remove("active"));
                this.classList.add("active");

                loginTitle.textContent =
                    selectedRole.charAt(0).toUpperCase() +
                    selectedRole.slice(1) + " Login";

                message.textContent = "";
                message.style.color = "#fca5a5";
            });
        });

        // Login form
        loginForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.style.color = "#7dd3fc";
            message.textContent = "Logging in...";
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        role: selectedRole,
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    message.style.color = "#86efac";
                    message.textContent =
                        data.message || "Login successful!";
                } else {
                    message.style.color = "#fca5a5";
                    message.textContent =
                        data.message || "Invalid login details";
                }

            } catch (error) {
                message.style.color = "#fca5a5";
                message.textContent =
                    "Backend connection failed. Start Flask server.";
            } finally {
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
